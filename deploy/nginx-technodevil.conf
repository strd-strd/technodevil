# /etc/nginx/sites-available/technodevil
# proxy → PM2 technodevil на 127.0.0.1:3002
# SSL: certbot --nginx -d technodevil.ru -d www.technodevil.ru \
#   -d technodevil.net -d www.technodevil.net \
#   -d xn--b1adc0ahgc0a2a7e7a.xn--p1ai -d www.xn--b1adc0ahgc0a2a7e7a.xn--p1ai

server {
    listen 80;
    listen [::]:80;
    server_name technodevil.ru www.technodevil.ru
                technodevil.net www.technodevil.net
                xn--b1adc0ahgc0a2a7e7a.xn--p1ai www.xn--b1adc0ahgc0a2a7e7a.xn--p1ai;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
