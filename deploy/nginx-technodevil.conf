# /etc/nginx/sites-available/technodevil
# FastFox RU 5.44.41.186 · proxy → PM2 technodevil на 127.0.0.1:3007
# SSL: certbot --nginx -d technodevil.ru -d www.technodevil.ru \
#   -d xn--b1adc0ahgc0a2a7e7a.xn--p1ai -d www.xn--b1adc0ahgc0a2a7e7a.xn--p1ai
#
# технодьявол.рф (xn--b1adc0ahgc0a2a7e7a.xn--p1ai) → 301 на https://technodevil.ru

# Основной сайт
server {
    listen 80;
    listen [::]:80;
    server_name technodevil.ru www.technodevil.ru;

    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Редирект с технодьявол.рф → technodevil.ru
server {
    listen 80;
    listen [::]:80;
    server_name xn--b1adc0ahgc0a2a7e7a.xn--p1ai www.xn--b1adc0ahgc0a2a7e7a.xn--p1ai;

    return 301 https://technodevil.ru$request_uri;
}
